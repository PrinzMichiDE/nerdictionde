name: Docker Image

# Builds the production Docker image, publishes it to GitHub Container Registry
# (GHCR) and smoke-tests the running container.
#
# Published images:
#   ghcr.io/<owner>/<repo>:latest        (default branch only)
#   ghcr.io/<owner>/<repo>:<branch>
#   ghcr.io/<owner>/<repo>:<version>     (git tags like v1.2.3)
#   ghcr.io/<owner>/<repo>:sha-<commit>
#
# No extra secrets are required: the workflow authenticates against GHCR with
# the automatically provided GITHUB_TOKEN (packages: write).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma separated)"
        required: false
        default: "linux/amd64"
      push:
        description: "Push the built image to GHCR"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Build for amd64 by default. For ARM servers (e.g. Raspberry Pi, Ampere)
  # set PLATFORMS to "linux/amd64,linux/arm64" (slower: emulated build).
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires a lowercase image name; the repository is PrinzMichiDE/nerdictionde.
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY,,}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=nerdictionde
            org.opencontainers.image.description=Next.js application with Prisma
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* values are baked into the client bundle.
          # Configure them as repository variables (Settings > Secrets and variables > Actions > Variables).
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations are only attached when the image is pushed (the local
          # docker exporter used for PR builds does not support them).
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Image summary
        run: |
          {
            echo "### Docker image"
            echo ""
            echo '```'
            echo "${{ steps.image.outputs.name }}"
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Smoke test container
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run container and check /api/health
        run: |
          IMAGE="${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"
          docker pull "$IMAGE"
          docker run -d --name nerdiction-smoke -p 3000:3000 \
            -e DATABASE_URL="postgresql://dummy:dummy@localhost:5432/dummy?schema=public" \
            "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo ""
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy in time."
          docker logs nerdiction-smoke
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs nerdiction-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f nerdiction-smoke || true
